<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>JobPilot</title>
<link rel="icon" href="/favicon.svg">
<style nonce="{{NONCE}}">
:root{color-scheme:light;
  --page:#f4f4f1;--surface:#fcfcfb;--surface-2:#f2f1ed;--surface-3:#e8e7e1;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#6e6d68;--faint:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--border-2:rgba(11,11,11,.17);
  --accent:#256abf;--accent-soft:rgba(42,120,214,.10);--accent-ring:rgba(42,120,214,.40);
  --btn:#256abf;--btn-hover:#1c5cab;--btn-ink:#ffffff;
  --good:#0ca30c;--good-text:#006300;--good-soft:rgba(12,163,12,.10);
  --warning:#fab219;--warning-text:#8a5400;--warning-soft:rgba(250,178,25,.18);
  --critical:#d03b3b;--critical-text:#b42d2d;--critical-soft:rgba(208,59,59,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s0:#898781;
  --f1:#104281;--f2:#1c5cab;--f3:#2a78d6;--f4:#5598e7;--f5:#86b6ef;
  --track-soft:.16;
  --shadow:0 1px 2px rgba(11,11,11,.04),0 6px 20px rgba(11,11,11,.045);
  --shadow-lg:0 28px 70px rgba(11,11,11,.22);
  --scrim:rgba(11,11,11,.30);
  --r:14px;--r-sm:10px;--r-xs:7px;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#222220;--surface-3:#2c2c2a;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#a8a69e;--faint:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.17);
  --accent:#6da7ec;--accent-soft:rgba(57,135,229,.16);--accent-ring:rgba(109,167,236,.5);
  --btn:#3987e5;--btn-hover:#5598e7;--btn-ink:#0b0b0b;
  --good-text:#3fbf3f;--good-soft:rgba(12,163,12,.16);--warning-text:#e5b54a;--warning-soft:rgba(250,178,25,.14);
  --critical-text:#f08585;--critical-soft:rgba(208,59,59,.18);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --f1:#9ec5f4;--f2:#6da7ec;--f3:#3987e5;--f4:#256abf;--f5:#184f95;
  --track-soft:.24;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 28px 70px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--surface-2:#222220;--surface-3:#2c2c2a;
  --ink:#f0efec;--ink-2:#c3c2b7;--muted:#a8a69e;--faint:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.17);
  --accent:#6da7ec;--accent-soft:rgba(57,135,229,.16);--accent-ring:rgba(109,167,236,.5);
  --btn:#3987e5;--btn-hover:#5598e7;--btn-ink:#0b0b0b;
  --good-text:#3fbf3f;--good-soft:rgba(12,163,12,.16);--warning-text:#e5b54a;--warning-soft:rgba(250,178,25,.14);
  --critical-text:#f08585;--critical-soft:rgba(208,59,59,.18);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --f1:#9ec5f4;--f2:#6da7ec;--f3:#3987e5;--f4:#256abf;--f5:#184f95;
  --track-soft:.24;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 28px 70px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding:0 0 max(24px,env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px}h3{font-size:13px;color:var(--ink-2);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:16px;height:16px;flex:none;vertical-align:-3px}
.icon-sm{width:14px;height:14px;flex:none;vertical-align:-2px}
/* ---------- header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.brand svg{width:28px;height:28px}
.brand .b1{fill:var(--btn)}.brand .b2{fill:var(--btn-ink)}.brand .b3{opacity:.55}
.ws{font-size:12px;color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:999px;
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--ink-2);cursor:pointer;font-weight:550;
  white-space:nowrap;position:relative}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;border-radius:2px;
  background:var(--accent)}
.tab .badge{margin-left:5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill.busy .dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* ---------- buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;
  border:1px solid var(--border-2);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:550;
  white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:28px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-icon{width:32px;padding:0}
.btn-danger{color:var(--critical-text)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-2);font-size:12px;font-weight:550;white-space:nowrap;border:1px solid transparent}
.chip.out{background:transparent;border-color:var(--border-2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s0)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.st.ready{color:var(--accent)}.st.applied{color:var(--good-text)}.st.saved{color:var(--ink-2)}
.st.warn{color:var(--warning-text)}.st.bad{color:var(--critical-text)}
/* ---------- layout */
main{max-width:1240px;margin:0 auto;padding:22px 24px 40px}
.view{display:grid;gap:18px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;
  min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:grid;gap:18px;min-width:0}
.banner{max-width:1240px;margin:12px auto 0;padding:0 24px}
.banner .b{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:var(--r-sm);font-size:13px;
  background:var(--accent-soft);color:var(--ink)}
.banner .b.warn{background:var(--warning-soft)}.banner .b.bad{background:var(--critical-soft)}
/* ---------- today */
.hero-row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.5fr);gap:18px}
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:206px}
.hero .eyebrow{font-size:13px;color:var(--muted)}
.hero .big{display:flex;align-items:baseline;gap:12px;margin:10px 0 4px}
.hero .big b{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.04em}
.hero .big span{font-size:18px;font-weight:600}
.hero .hsub{color:var(--ink-2);font-size:13.5px}
.hero .tracks{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px 18px}
.tile .label{font-size:12.5px;color:var(--muted);font-weight:550}
.tile .value{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.2}
.tile .foot{font-size:12.5px;color:var(--ink-2)}
.track-head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:16px 0 6px;font-size:13px;font-weight:650}
.track-head .nm{white-space:nowrap}
.track-head:first-child{margin-top:0}
.track-head .muted{font-weight:500}
.track-head .right{margin-left:auto}
.matches{display:grid;gap:2px}
.match{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  border:0;background:none;padding:9px 10px;border-radius:11px;cursor:pointer;color:inherit}
.match:hover{background:var(--surface-2)}
.m-title{font-weight:620;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-meta{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-why{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.m-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gap-chip{font-size:11.5px;color:var(--warning-text);background:var(--warning-soft);padding:1px 8px;border-radius:999px;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:40px;height:40px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  letter-spacing:-.02em}
.ring.lg{width:92px;height:92px}.ring.lg b{font-size:26px;flex-direction:column;line-height:1}
.ring.lg b small{font-size:11px;font-weight:550;color:var(--muted);margin-top:3px}
.due{display:grid;gap:2px}
.due-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:8px 6px;border-radius:10px;
  cursor:pointer;border:0;background:none;text-align:left;width:100%;color:inherit}
.due-item:hover{background:var(--surface-2)}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;border-radius:10px;
  background:var(--surface-2);font-variant-numeric:tabular-nums}
.datebox .mo{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:650;letter-spacing:.04em}
.datebox .dy{font-size:17px;font-weight:700;line-height:1.1}
.datebox.soon{background:var(--warning-soft)}.datebox.over{background:var(--critical-soft)}
.datebox .icon{color:var(--muted)}
.due-kind{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.due-t{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-s{font-size:12.5px;color:var(--ink-2)}
.due-q{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-h{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 6px 4px}
.due-group+.due-group{margin-top:14px}
.gist{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:3px}
.gist .icon-sm{color:var(--accent);margin-top:1px}
.due-item .gist{white-space:normal}
.ev.minor .tx{color:var(--ink-2)}
.mail-item{display:grid;gap:2px;padding-bottom:8px}
.mail-item+.mail-item{border-top:1px solid var(--grid);padding-top:6px}
.mail-acts{display:flex;flex-wrap:wrap;gap:6px;padding-left:70px}
.datebox.mail{background:var(--accent-soft)}.datebox.mail .icon{color:var(--accent)}
.btn[data-armed="1"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ev .tx a{font-size:12.5px;margin-left:6px;white-space:nowrap}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
.empty .t{color:var(--ink);font-weight:600;font-size:14px;margin-bottom:4px}
.empty svg{width:28px;height:28px;color:var(--faint);margin-bottom:6px}
/* ---------- charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11.5px}
.chart .lbl{fill:var(--ink-2);font-size:12.5px}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:650}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .dcol:hover .seg,.chart .bar:hover .fill,.chart .dcol:focus .seg,.chart .bar:focus .fill{filter:brightness(1.12)}
.chart .dcol:focus,.chart .bar:focus{outline:none}
.chart .dcol:focus .hit,.chart .bar:focus .hit{stroke:var(--accent-ring);stroke-width:2}
.chart .f1{fill:var(--f1)}.chart .f2{fill:var(--f2)}.chart .f3{fill:var(--f3)}.chart .f4{fill:var(--f4)}.chart .f5{fill:var(--f5)}
.chart .soft{fill:var(--muted);font-weight:500}
.ring .bg{stroke:var(--surface-3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.seg-toggle{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.seg-toggle button{border:0;background:none;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg-toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border-2);
  border-radius:10px;box-shadow:var(--shadow-lg);padding:8px 11px;font-size:12.5px;min-width:120px;max-width:260px}
.tip .tt{font-weight:650;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .tr .k{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .tr .k i{width:12px;height:2px;border-radius:1px;display:inline-block}
.tip .tr b{font-variant-numeric:tabular-nums}
.mini-table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mini-table th,.mini-table td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--grid)}
.mini-table th:first-child,.mini-table td:first-child{text-align:left}
.mini-table th{color:var(--muted);font-weight:600}
/* ---------- report */
.rep-lines{display:grid;gap:8px;font-size:13px}
.rep-line{display:flex;gap:8px;align-items:center}.rep-line.top{align-items:flex-start}
.rep-line .k{color:var(--muted);min-width:110px}
.problem{display:flex;gap:8px;align-items:flex-start;color:var(--warning-text);font-size:12.5px}
/* ---------- filters + table */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;height:34px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);
  padding:0 34px 0 34px}
.search svg{position:absolute;left:11px;top:9px;color:var(--muted)}
.search kbd{position:absolute;right:9px;top:8px;font:11px var(--mono);color:var(--muted);border:1px solid var(--border-2);
  border-radius:5px;padding:0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border-2);
  background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chipbtn:hover{background:var(--surface-2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chipbtn[aria-pressed="true"] .badge{background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface)}
select,.input{height:34px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);padding:0 10px}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:60px}
.range{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.range input{accent-color:var(--btn);width:110px}
.range output{min-width:26px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.tbl th button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th button[aria-sort]::after{content:"↓";font-size:11px}
.tbl th button[aria-sort="ascending"]::after{content:"↑"}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .role b{font-weight:620;display:block}
.tbl td.nw{white-space:nowrap}
.tbl .role span{font-size:12.5px;color:var(--muted)}
.score-cell{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}

.kcard:hover{border-color:var(--border-2)}
.kcard .co{font-weight:650;display:flex;align-items:center;gap:6px}

.kcard .ro{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.next{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;

.next.warn{background:var(--warning-soft);color:var(--warning-text)}
.next.good{background:var(--good-soft);color:var(--good-text)}
.funnel-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:flex;flex-direction:column;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  min-width:96px}
.fchip b{font-size:20px;letter-spacing:-.02em}
.fchip span{font-size:12px;color:var(--muted)}
.arrow{color:var(--faint)}
/* ---------- referrals */
.refs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.co-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;

.co-item:hover{background:var(--surface-2)}

.co-item .avatar{width:32px;height:32px;font-size:12px}
.co-item .nm{font-weight:620;display:block}
.co-item .ct{font-size:12px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:13px;flex:none;background:var(--surface-3);color:var(--ink-2)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;
  text-align:left;color:inherit;display:grid;gap:8px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--border-2)}
.pcard.dim{opacity:.62}
.p-top{display:flex;gap:10px;align-items:center}
.p-top .nm{font-weight:650;display:block}
.p-top .tt{font-size:12.5px;color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-why{font-size:12.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;

.p-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meter{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:1}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.meter.warn i{background:var(--warning)}.meter.bad i{background:var(--critical)}
.pscore{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.pscore .meter{width:70px;flex:none}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form-row .input{flex:1 1 160px;min-width:0}
.note-box{background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.note-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.note-head h3{margin:0}
.note-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--critical-text);font-weight:650}
ol.qs{margin:0;padding-left:20px;display:grid;gap:5px;font-size:13.5px}
/* ---------- search tab */
.meter-card .big{font-size:26px;font-weight:650;letter-spacing:-.02em}
.meter-card .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.meter-card .meter{height:8px;border-radius:4px;margin:10px 0 8px}
.meter-card .meter i{border-radius:4px}
.meter-card .meter.track{background:color-mix(in srgb,var(--btn) 18%,var(--surface))}
.meter-card .meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.flist{display:grid;gap:2px;max-height:520px;overflow-y:auto}
.fitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 8px;border-radius:10px;align-items:center}
.fitem:hover{background:var(--surface-2)}
.fitem .t{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.fitem .w{font-size:12.5px;color:var(--ink-2);display:block}
.fitem .k{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.runs{display:grid;gap:0}
.run{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:9px 4px;border-bottom:1px solid var(--grid);
  align-items:center;font-size:13px}
.run:last-child{border-bottom:0}
.run .d{font-weight:620;font-variant-numeric:tabular-nums}
/* ---------- activity */
.feed{display:grid}
.feed .day{font-size:12px;font-weight:650;color:var(--muted);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
.feed .day:first-child{padding-top:0}
.ev{display:grid;grid-template-columns:66px 26px minmax(0,1fr);gap:10px;align-items:start;padding:7px 4px;border-radius:9px}
.ev:hover{background:var(--surface-2)}
.ev .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;white-space:nowrap}
.ev .ic{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2)}
.ev .ic svg{width:14px;height:14px}
.ev .tx{font-size:13.5px;overflow-wrap:anywhere}
.ev .kd{font-size:11.5px;color:var(--muted);display:block}
/* ---------- drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);z-index:60;background:var(--surface);

  border-left:1px solid var(--border)}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.d-head{padding:18px 24px 14px;border-bottom:1px solid var(--border);padding-top:max(18px,env(safe-area-inset-top))}
.d-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.d-top .right{margin-left:auto}
.d-title{font-size:20px;line-height:1.3;letter-spacing:-.02em}
.d-sub{font-size:13px;color:var(--ink-2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.d-links{display:flex;gap:14px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.d-body{flex:1;overflow-y:auto;padding:18px 24px 30px;display:grid;gap:22px;align-content:start}
.d-foot{border-top:1px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--surface)}
.d-foot .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sec h3{margin-bottom:9px}
.score-top{display:flex;gap:18px;align-items:center}
.score-top .info{display:grid;gap:4px}
.score-top .cat{font-weight:650;font-size:14px}
.score-top .cap{font-size:12.5px;color:var(--warning-text);display:flex;gap:6px;align-items:flex-start}
.comp{display:grid;gap:5px;padding:11px 0;border-bottom:1px solid var(--grid)}
.comp:last-child{border-bottom:0}
.comp-h{display:grid;grid-template-columns:96px minmax(0,1fr) 58px;gap:12px;align-items:center}
.comp-h .nm{font-weight:620;font-size:13px}
.comp-h .meter{height:7px}
.comp-h .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.comp-h .v small{color:var(--muted);font-weight:500}
.comp .why{font-size:13px;color:var(--ink-2);padding-left:108px}
.quote{display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.comp .quote{padding-left:108px;margin-top:0}
.quote .src{flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;
  background:var(--surface-2);color:var(--muted);height:17px;line-height:15px}
.quote .src.you{background:var(--accent-soft);color:var(--accent)}
.quote q{quotes:"“" "”" "‘" "’";font-style:italic}
.jd{white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--ink-2);background:var(--surface-2);border-radius:11px;
  padding:12px 14px;max-height:420px;overflow-y:auto}
details>summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:15px}
details[open]>summary::before{transform:rotate(90deg)}
details>summary+*{margin-top:10px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.stepper{display:flex;gap:4px;align-items:center}
.step{flex:1;display:grid;gap:5px;justify-items:center;font-size:11.5px;color:var(--muted);text-align:center}
.step i{width:100%;height:5px;border-radius:3px;background:var(--surface-3)}
.step.done i{background:var(--f3)}.step.cur{color:var(--ink);font-weight:650}.step.cur i{background:var(--btn)}
.step.closed i{background:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.inline-form{display:grid;gap:10px;background:var(--surface-2);padding:12px;border-radius:12px;margin-top:10px}
.inline-form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.tl{display:grid;gap:0;position:relative}
.tl-i{display:grid;grid-template-columns:86px 14px minmax(0,1fr);gap:10px;padding:6px 0;font-size:13px}
.tl-i .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.tl-i .m{width:9px;height:9px;border-radius:50%;background:var(--axis);margin-top:5px}
.tl-i.key .m{background:var(--btn)}
.tl-i .n{display:block;color:var(--ink-2);font-size:12.5px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:11px}
.file .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:grid;
  gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);

.toast.bad{background:var(--critical);color:#fff}
.login{position:fixed;inset:0;z-index:100;background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{max-width:420px;width:100%;padding:28px;display:grid;gap:14px}
.login p{margin:0;color:var(--ink-2);font-size:13.5px}
code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
/* ---------- responsive */
@media (max-width:1080px){

  .refs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){

  .tab[aria-selected="true"]::after{bottom:0}
  .tab{padding:9px 11px}
  .ws{display:none}
  main{padding:16px 16px 40px}
  .banner{padding:0 16px}
  .grid-2e,.grid-3{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
  .pill{display:none}
}
@media (max-width:620px){
  .kpis{gap:12px}
  .tile{padding:14px}
  .tile .value{font-size:26px}
  .hero .big b{font-size:54px}
  .match{grid-template-columns:40px minmax(0,1fr)}
  .m-side{display:none}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:1px solid var(--grid);padding:10px 4px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
  .tbl td{border:0;padding:0}
  .tbl td.c-score{grid-row:span 3;align-self:center}
  .tbl td.c-track,.tbl td.c-loc,.tbl td.c-posted{display:none}
  .tbl tbody tr:hover td{background:none}
  .comp-h{grid-template-columns:84px minmax(0,1fr) 52px}

  .mail-acts{padding-left:0}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .btn-run .lbl{display:none}
}

.shot *{animation:none!important;transition:none!important}

function pct(n) { return n === null || n === undefined ? t('none') : Math.round(n * 100) + '%'; }
function parseT(v) { if (!v) return null; const s = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T12:00:00' : v; const d = new Date(s); return isNaN(d) ? null : d; }
function ago(v) {
  const d = parseT(v); if (!d) return '';
  const sec = (Date.now() - d.getTime()) / 1000;
  const rtf = new Intl.RelativeTimeFormat(locale(), {numeric: 'auto'});
  const a = Math.abs(sec);
  if (a < 60) return t('now');
  if (a < 3600) return rtf.format(-Math.round(sec / 60), 'minute');
  if (a < 86400) return rtf.format(-Math.round(sec / 3600), 'hour');
  if (a < 86400 * 30) return rtf.format(-Math.round(sec / 86400), 'day');

}

function dateLong(v) { const d = parseT(v); return d ? d.toLocaleDateString(locale(), {weekday: 'short', month: 'short', day: 'numeric'}) : ''; }

const shortLoc = s => String(s || '').replace(/, United States$/, '').replace(/ \| .*$/, '');
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

async function api(name, params) {
  if (STATIC) return staticApi(name, params || {});
  const qs = params ? '?' + new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v !== null && v !== undefined)).toString() : '';
  const res = await fetch('/api/' + name + qs, {credentials: 'same-origin', headers: {Accept: 'application/json'}});
  if (res.status === 401) { showLogin(); throw new Error('sign in'); }
  const data = await res.json().catch(() => ({error: res.statusText}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function post(name, body) {
  if (STATIC) { toast(t('static_write')); return null; }
  const res = await fetch('/api/' + name, {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-JobPilot-CSRF': (S && S.csrf) || ''}, body: JSON.stringify(body || {})});
  const data = await res.json().catch(() => ({error: res.statusText}));
  if (res.status === 401) { showLogin(); return null; }
  if (!res.ok) { toast(data.error || res.statusText, true); return null; }
  return data;
}
const STATUS_GROUPS = {ready: ['ready'], saved: ['hold'], applied: ['applied'], skipped: ['skipped'], below: ['below_threshold'],
  excluded: ['excluded'], filtered: ['dropped'], pending: ['pending'], stale: ['stale'], admitted: ['ready', 'hold', 'applied', 'skipped'], all: null};
function staticApi(name, q) {
  const D = STATIC;
  const one = (k, id) => { const v = (D[k] || {})[id]; if (!v) throw new Error('not found'); return v; };
  switch (name) {
    case 'session': return Object.assign({}, D.session, {static: true});
    case 'pool': return filterPool(D.pool_all || [], q);
    case 'posting': return one('posting', q.id);
    case 'app': return one('app', q.id);
    case 'person': return one('person', q.id);
    case 'report': return one('report', q.date);
    default: if (name in D) return JSON.parse(JSON.stringify(D[name])); throw new Error('no ' + name);
  }
}
function filterPool(rows, q) {
  const statuses = STATUS_GROUPS[q.status || 'ready'];
  const text = String(q.q || '').trim().toLowerCase();
  const min = q.min === undefined || q.min === '' ? null : +q.min;
  const counts = {}, trackCounts = {};
  rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
  let out = rows.filter(r => !statuses || statuses.includes(r.status));
  out = out.filter(r => !text || (String(r.title) + ' ' + r.company + ' ' + (r.location || '')).toLowerCase().includes(text));
  out = out.filter(r => min === null || (r.score || 0) >= min);
  out.forEach(r => { const k = r.track || ''; trackCounts[k] = (trackCounts[k] || 0) + 1; });
  if (q.track) out = out.filter(r => r.track === q.track);
  const desc = (q.order || 'desc') !== 'asc';
  const key = {score: r => [r.score || 0, r.posted_at || r.first_seen || ''], posted: r => [r.posted_at || r.first_seen || ''],
    company: r => [String(r.company || '').toLowerCase()], title: r => [String(r.title || '').toLowerCase()]}[q.sort || 'score'];
  out.sort((a, b) => { const x = key(a), y = key(b); for (let i = 0; i < x.length; i++) { if (x[i] < y[i]) return desc ? 1 : -1; if (x[i] > y[i]) return desc ? -1 : 1; } return 0; });
  const offset = +q.offset || 0, limit = +q.limit || 50;
  return {total: out.length, offset, rows: out.slice(offset, offset + limit), counts, track_counts: trackCounts, group: q.status || 'ready'};
}

/* ------------------------------------------------------------------ toasts, tooltip */
function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');

  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 3500);

const tip = $('#tip');
function showTip(target, ev) {
  let data; try { data = JSON.parse(target.dataset.tip); } catch (e) { return; }
  tip.replaceChildren();
  if (data.title) { const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = data.title; tip.appendChild(tt); }
  (data.rows || []).forEach(([label, value, color]) => {
    const row = document.createElement('div'); row.className = 'tr';
    const k = document.createElement('span'); k.className = 'k';
    if (color) { const i = document.createElement('i'); i.style.background = color; k.appendChild(i); }
    k.appendChild(document.createTextNode(label));
    const b = document.createElement('b'); b.textContent = value;
    row.append(k, b); tip.appendChild(row);
  });
  tip.hidden = false;
  const rect = target.getBoundingClientRect();
  const x = ev && ev.clientX ? ev.clientX : rect.left + rect.width / 2, y = ev && ev.clientY ? ev.clientY : rect.top;
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - hh - 8, y - hh - 10)) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else tip.hidden = true; });

function funnelChart(fun) {

function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function dailyChart(sum) {
  const days = sum.days || [], tracks = S.tracks || [];
  const totals = days.map((d, i) => tracks.reduce((a, tr) => a + ((sum.series[tr.id] || [])[i] || 0), 0));
  const W = 520, H = 196, left = 30, bottom = 24, top = 18, plotH = H - bottom - top, plotW = W - left - 4;
  const ymax = niceMax(Math.max(1, ...totals)), band = plotW / Math.max(1, days.length), bw = Math.min(24, band * 0.5);

  const cols = days.map((d, i) => {

      const isTop = j === present.length - 1, gapPx = j ? 2 : 0;
      const segH = Math.max(1, hgt - gapPx);

      const path = isTop && segH >= 5
        ? 'M' + x + ' ' + (y + segH) + 'v-' + (segH - 4) + 'a4 4 0 0 1 4 -4h' + (bw - 8) + 'a4 4 0 0 1 4 4v' + (segH - 4) + 'z'

    <div class="big num">${money(spent)}<small>/ ${money(cap)}</small></div>

    <div class="meta">${cls ? h`${icon('alert', 'icon-sm')}<b>${t(ratio >= 1 ? 'at_cap' : 'near_cap')}</b> · ` : ''}${foot}</div></div>`;
}

      const body = {company: $('#na-company').value.trim(), role: $('#na-role').value.trim(), url: $('#na-url').value.trim(), applied: $('#na-applied').checked};
      if (!body.company || !body.role) return;
      const r = await post('app/create', body); if (r) { toast(t('saved')); afterWrite(); } return;
    }
    case 'pick-company': state.refsCompany = el.dataset.key; return renderRefs();
    case 'goto-refs': { const ck = (state.cache.refs && (state.cache.refs.companies || []).find(c => c.name === el.dataset.company)); closeDrawer(); if (ck) state.refsCompany = ck.key; return setTab('refs'); }
    case 'net-find': { const company = $('#nf-company').value.trim(); if (!company) return; const r = await post('net/find', {company, url: $('#nf-url').value.trim()}); if (r) { toast(t('started')); state.tasks.push(r.task); } return; }
    case 'net-cards': { const r = await post('net/cards', {company: el.dataset.company}); if (r) { toast(t('started')); state.tasks.push(r.task); } return; }
    case 'net-mark': { const r = await post('net/mark', {pid: el.dataset.pid, event: el.dataset.ev}); if (r) { toast(t('saved')); afterWrite(); } return; }
    case 'copy': return copyText(el.dataset.text, el);
    case 'filtered-kind': state.filteredKind = el.dataset.kind; return renderSearch();
    case 'static-file': ev.preventDefault(); return toast(t('static_write'));
    case 'mail-hidden': ev.preventDefault(); return toast(t('mail_hidden'));
    case 'mail-invite': { const r = await post('inbox/invite', {app_id: id}); if (r) { toast(t('mail_invited')); afterWrite(); } return; }
    case 'mail-done': { const r = await post('inbox/answered', {app_id: id}); if (r) { toast(t('mail_answered')); afterWrite(); } return; }
  }
}
async function afterWrite() {
  state.cache.summary = null;
  await refresh(true);
  reopen();
}
function reopen() {
  if (!state.drawer) return;
  const {kind, id} = state.drawer;
  ({posting: openPosting, app: openApp, person: openPerson}[kind] || (() => {}))(id).catch(() => closeDrawer());
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) {} ta.remove(); }
  const old = btn.innerHTML; btn.textContent = t('copied'); setTimeout(() => { btn.innerHTML = old; }, 1400);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'A' && !el.getAttribute('href').startsWith('#') && el.dataset.act !== 'static-file') return;
  act(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.drawer) { closeDrawer(); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); if (state.tab !== 'pool') setTab('pool'); setTimeout(() => { const i = $('#pool-q'); if (i) i.focus(); }, 60); return; }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('tr[data-act]')) { act(document.activeElement, e); }
});
let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'pool-q') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.poolq.q = e.target.value; state.poolq.limit = 50; renderPool(); }, 220); }
  if (e.target.id === 'pool-min') { const o = e.target.nextElementSibling; if (o) o.textContent = fmtNum(+e.target.value, 1); clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.poolq.min = +e.target.value; renderPool(); }, 180); }
});
document.addEventListener('change', e => { if (e.target.id === 'pool-status') { state.poolq.status = e.target.value; state.poolq.limit = 50; renderPool(); } });
$('#scrim').addEventListener('click', closeDrawer);

/* ------------------------------------------------------------------ chrome, theme, language */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  const tabs = ['today', 'pool', 'apps', 'refs', 'search', 'activity'];
  html($('#tabs'), h`${tabs.map(x => h`<button class="tab" role="tab" data-act="tab" data-tab="${x}" aria-selected="${state.tab === x}">${t('tab_' + x)}</button>`)}`);
  $('#lang-btn').textContent = t('lang_other');
  html($('#run-btn'), h`${icon('play', 'icon-sm')}<span class="lbl">${t('run_now')}</span>`);
  $('#theme-btn').setAttribute('aria-label', t('theme'));
  setThemeIcon();
}
function setThemeIcon() {
  const th = document.documentElement.dataset.theme;
  html($('#theme-btn'), icon(th === 'dark' ? 'moon' : th === 'light' ? 'sun' : 'half'));
}
function cycleTheme() {
  const cur = document.documentElement.dataset.theme || '';
  const next = cur === '' ? 'dark' : cur === 'dark' ? 'light' : '';
  if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
  try { if (next) localStorage.setItem('jobpilot.theme', next); else localStorage.removeItem('jobpilot.theme'); } catch (e) {}
  setThemeIcon();
}
function updateChrome(sum) {
  const running = (state.tasks || []).filter(x => x.status === 'running');
  const pill = $('#run-pill');
  pill.classList.toggle('busy', running.length > 0);
  const lbl = pill.querySelector('.lbl');
  if (running.length) lbl.textContent = t('running') + ' · ' + t('task_' + running[0].kind);
  else if (sum && sum.last_daily) lbl.textContent = t('last_run', {when: ago(sum.last_daily.at)});
  else lbl.textContent = '';
  const banner = $('#banner'), msgs = [];
  if (STATIC) msgs.push(['', t('static_banner')]);
  else if (S && S.demo) msgs.push(['', t('demo_banner')]);
  if (sum && sum.paused) msgs.push(['warn', t('paused_banner')]);
  banner.hidden = !msgs.length;
  if (msgs.length) html(banner, h`${msgs.map(([cls, m]) => h`<div class="b ${cls}">${icon(cls ? 'alert' : 'spark', 'icon-sm')}<span>${md(m)}</span></div>`)}`);
  $('#run-btn').disabled = !!(running.find(x => x.kind === 'daily'));
}
let prevRunning = new Set();
async function poll() {
  if (document.hidden || STATIC) return;
  const running = (state.tasks || []).filter(x => x.status === 'running');
  const wait = running.length ? 5000 : 30000;
  if (Date.now() - state.lastFetch < wait) return;
  try {
    const tasks = await api('tasks', {n: 20});
    tasks.forEach(task => {
      if (prevRunning.has(task.id) && task.status !== 'running') toast(t(task.status === 'done' ? 'task_done' : 'task_failed', {kind: t('task_' + task.kind)}), task.status !== 'done');
    });
    prevRunning = new Set(tasks.filter(x => x.status === 'running').map(x => x.id));
    state.tasks = tasks;
  } catch (e) { return; }
  state.cache.summary = null;
  refresh();
}

/* ------------------------------------------------------------------ login and boot */
function showLogin() {
  const box = $('#login');
  if (!box.hidden) return;
  box.hidden = false;
  html(box, h`<div class="card"><h2>${t('login_t')}</h2><p>${md(t('login_p'))}</p>
    <input class="input" id="login-key" type="password" placeholder="${t('key')}" autocomplete="off">
    <button class="btn btn-primary" id="login-go">${t('sign_in')}</button><p class="muted" id="login-err"></p></div>`);
  const go = async () => {
    const res = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin', body: JSON.stringify({key: $('#login-key').value.trim()})});
    if (res.ok) { box.hidden = true; boot(); } else $('#login-err').textContent = t('bad_key');
  };
  $('#login-go').addEventListener('click', go);
  $('#login-key').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
async function boot() {
  const params = new URLSearchParams(location.hash.slice(1).includes('=') ? location.hash.slice(1) : 'tab=' + (location.hash.slice(1) || 'today'));
  const qkey = new URLSearchParams(location.search).get('key');
  if (qkey && !STATIC) {
    await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin', body: JSON.stringify({key: qkey})});
    history.replaceState(null, '', location.pathname + location.hash);
  }
  try { S = await api('session'); } catch (e) { if (String(e.message) !== 'sign in') toast(t('offline'), true); return; }
  let stored = null; try { stored = localStorage.getItem('jobpilot.lang'); } catch (e) {}
  LANG = params.get('lang') || stored || S.language || 'en';
  if (!I18N[LANG]) LANG = 'en';
  let theme = params.get('theme'); if (!theme) { try { theme = localStorage.getItem('jobpilot.theme'); } catch (e) {} }
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  if (params.get('shot')) document.body.classList.add('shot');
  $('#ws-name').textContent = S.workspace || '';
  const tab = params.get('tab');
  state.tab = ['today', 'pool', 'apps', 'refs', 'search', 'activity'].includes(tab) ? tab : 'today';
  if (params.get('status')) state.poolq.status = params.get('status');
  applyLang();
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'view-' + state.tab; });
  await refresh(true);
  const open = params.get('open');
  if (open && open.includes(':')) {
    const [kind, oid] = [open.slice(0, open.indexOf(':')), open.slice(open.indexOf(':') + 1)];
    state.drawer = {kind, id: oid}; reopen();
  }
  if (!state.booted) {
    state.booted = true;
    setInterval(poll, 2500);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { state.lastFetch = 0; poll(); } });
  }
  window.__jobpilotReady = true;
}
boot();
})();
</script>
